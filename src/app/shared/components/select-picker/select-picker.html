<button
  #trigger
  class="picker-trigger"
  [class.compact]="compact()"
  type="button"
  [disabled]="disabled()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  (click)="openPicker()"
>
  <span>{{
    selectedOption()?.label?.startsWith('i18n.')
      ? (selectedOption()?.label?.slice(5) | translate)
      : (selectedOption()?.label ?? placeholder())
  }}</span>
  <ion-icon name="chevron-down-outline" aria-hidden="true" />
</button>
@if (open()) {
  <div class="picker-overlay" role="presentation">
    <button
      class="picker-backdrop"
      type="button"
      [attr.aria-label]="'common.closePicker' | translate"
      (click)="close()"
    ></button>
    <section class="picker-sheet" role="dialog" aria-modal="true" [attr.aria-label]="sheetTitle()">
      <header>
        <h2>{{ sheetTitle() }}</h2>
        <button
          #closeButton
          type="button"
          [attr.aria-label]="'common.close' | translate"
          (click)="close()"
        >
          <ion-icon name="close-outline" aria-hidden="true" />
        </button>
      </header>
      @if (searchable()) {
        <label class="picker-search"
          ><ion-icon name="search-outline" aria-hidden="true" /><span class="sr-only">{{
            'common.search' | translate
          }}</span
          ><input
            #searchInput
            type="search"
            [placeholder]="'common.search' | translate"
            [value]="search()"
            (input)="updateSearch($event)"
        /></label>
      }
      <div class="picker-options" role="listbox">
        @for (option of filteredOptions(); track option.value) {
          <button
            class="picker-option"
            [class.selected]="option.value === value()"
            type="button"
            role="option"
            [attr.aria-selected]="option.value === value()"
            (click)="select(option.value)"
          >
            @if (option.icon) {
              <ion-icon [name]="option.icon" aria-hidden="true" />
            }
            <span
              ><strong>{{
                option.label.startsWith('i18n.')
                  ? (option.label.slice(5) | translate)
                  : option.label
              }}</strong>
              @if (option.detail) {
                <small>{{
                  option.detail.startsWith('i18n.')
                    ? (option.detail.slice(5) | translate)
                    : option.detail
                }}</small>
              }
            </span>
            @if (option.value === value()) {
              <ion-icon name="checkmark-circle" aria-hidden="true" />
            }
          </button>
        } @empty {
          <p role="status">{{ 'common.noMatches' | translate }}</p>
        }
      </div>
    </section>
  </div>
}
